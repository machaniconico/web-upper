<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Web Upper</title>
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 14px;
        color: #17211f;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      strong {
        display: block;
        font-size: 14px;
      }

      p {
        margin: 6px 0 12px;
        color: #67736f;
        font-size: 12px;
        line-height: 1.45;
      }

      button {
        width: 100%;
        min-height: 38px;
        border: 1px solid #0d967a;
        border-radius: 8px;
        background: #0d967a;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <strong>Web Upper</strong>
    <p>Open the current tab in the local UI editor.</p>
    <button id="openBtn" type="button">Open current page</button>
    <script src="popup.js"></script>
  </body>
</html>
